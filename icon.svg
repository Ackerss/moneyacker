<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente de fundo premium -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" /> <!-- Indigo escuro -->
      <stop offset="100%" stop-color="#0f172a" /> <!-- Slate escuro -->
    </linearGradient>
    <!-- Gradiente do Cartão / Logo -->
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" /> <!-- Indigo brilhante -->
      <stop offset="50%" stop-color="#8b5cf6" /> <!-- Violeta -->
      <stop offset="100%" stop-color="#ec4899" /> <!-- Rosa neon -->
    </linearGradient>
    <!-- Sombras do ícone -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Fundo com cantos arredondados para ser um ícone de app mobile moderno -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  
  <!-- Elementos de design abstratos no fundo -->
  <circle cx="100" cy="100" r="150" fill="#4f46e5" opacity="0.15" filter="blur(40px)" />
  <circle cx="412" cy="412" r="150" fill="#ec4899" opacity="0.15" filter="blur(40px)" />

  <!-- Desenho do Cartão de Crédito MoneyAcker Estilizado -->
  <g transform="translate(96, 128)" filter="url(#glow)">
    <!-- O Cartão -->
    <rect width="320" height="256" rx="36" fill="url(#logo-grad)" />
    
    <!-- Linha Magnética do Cartão -->
    <rect y="48" width="320" height="40" fill="#0f172a" opacity="0.8" />
    
    <!-- Chip do Cartão -->
    <rect x="36" y="112" width="48" height="38" rx="8" fill="#f59e0b" />
    <line x1="36" y1="131" x2="84" y2="131" stroke="#b45309" stroke-width="1.5" />
    <line x1="60" y1="112" x2="60" y2="150" stroke="#b45309" stroke-width="1.5" />
    
    <!-- Cifrão Neon Brilhante no lado direito -->
    <text x="210" y="196" fill="#ffffff" font-family="'Outfit', 'Inter', sans-serif" font-weight="700" font-size="110" text-anchor="middle" filter="drop-shadow(0px 4px 8px rgba(0,0,0,0.3))">$</text>
    
    <!-- Nome do App -->
    <text x="36" y="220" fill="#ffffff" opacity="0.9" font-family="'Outfit', 'Inter', sans-serif" font-weight="600" font-size="20" letter-spacing="1.5">MONEYACKER</text>
  </g>
</svg>
